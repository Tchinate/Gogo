<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/lol.css" rel="stylesheet">
    <title>Gogo Permis</title>
</head>

<body class="background" style="font-family: 'Times New Roman', Times, serif;">
    <div class="test">
        <div class="centertab">
            <table>
                <tr>
                    <td style="position: relative;">
                        <img class="smallcat" src="/meme/cat-explosion.jpg" />
                    </td>
                    <td style="position: relative; left: 1em; text-align: left; bottom: 1em;">
                        PARCE QUE T'AS EU TON PERMIS FÉLICITATIONS WAAAAAA !!!!
                    </td>
                    <td style="position: relative;">
                        <img class="smallhamster" src="/meme/hamster-smiling.jpg" />
                    </td>
                </tr>
            </table>
            <div class="wrapper" style="right: 30%;">
                <button id="btn">MERCIII &#128538</button>
                <canvas id="confetti-canvas"></canvas>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<script type="text/javascript">
    const btn = document.querySelector('#btn');
    const canvas = document.querySelector('#confetti-canvas');
    const canvas1 = document.querySelector('#confetti-canvas1');
    const canvas2 = document.querySelector('#confetti-canvas2');
    const myCanvas = [canvas, canvas1, canvas2];
    function onButtonClick() {
        myCanvas.forEach(element => {
            canvas = element;

            var myConfetti = confetti.create(canvas, {
                resize: true,
                useWorker: true
            });
            myConfetti({
                particleCount: 100,
                spread: 160
            });
        });
    }
    btn.addEventListener('click', onButtonClick);
</script>

</html>
